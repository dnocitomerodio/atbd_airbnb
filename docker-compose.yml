services:
  spark:
    build: .
    container_name: spark_container
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./notebooks:/app/notebooks
      - ./results:/app/results
      - ~/.kaggle:/root/.kaggle
    ports:
      - "4040:4040"
      - "8888:8888"
    tty: true
